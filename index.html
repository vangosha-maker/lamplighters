<title>Фонарщики</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: night-town board on the left, a narrow watchman's logbook on the right; stacks on phones. Single dark look by design. */
:root{
  color-scheme:dark;
  --night:#0d1126; --panel:#161c3a; --panel-2:#1e2650; --line:#2e3868;
  --ink:#e9e6f5; --ink-dim:#9aa3d0; --amber:#ffc46b; --amber-deep:#e89a3c; --danger:#ff5d6c; --ok:#8ff0a4;
  --wind:#5fd4e6; --hook:#f08a4b; --mirror:#c9a2ff;
  --display:"Yeseva One","Georgia",serif; --body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--amber);letter-spacing:.01em}
.top .sub{color:var(--ink-dim);font-size:14px;flex:1;min-width:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.boardwrap{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--night);box-shadow:0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status .where{font-family:var(--display);font-size:20px}
.status .turn{color:var(--ink-dim);font-size:13px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:11px;height:16px;border-radius:5px 5px 3px 3px;background:var(--amber);box-shadow:0 0 8px var(--amber-deep)}
.pip.off{background:var(--line);box-shadow:none}
.forecast{border-left:3px solid var(--ok);padding:8px 12px;background:var(--panel);border-radius:0 8px 8px 0;font-size:14px;min-height:44px}
.forecast.bad{border-color:var(--danger)}
.forecast b{font-weight:600}
.heroes{display:grid;gap:6px}
.hero{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.hero:hover{background:var(--panel-2)}
.hero.sel{border-color:var(--amber);background:var(--panel-2)}
.hero.done{opacity:.55}
.hero .dot{width:14px;height:14px;border-radius:50%}
.hero .nm{font-weight:600}
.hero .st{display:block;font-weight:400;font-size:12px;color:var(--ink-dim)}
.hero .hp{display:flex;gap:3px}
.hero .hp i{width:8px;height:8px;border-radius:2px;background:var(--ok)}
.hero .hp i.off{background:var(--line)}
.info{font-size:13.5px;color:var(--ink-dim);min-height:76px;padding:2px 2px}
.info b{color:var(--ink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
button.btn:hover:not(:disabled){border-color:var(--ink-dim)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.primary{grid-column:1/-1;background:var(--amber);color:#2a1a05;border-color:var(--amber)}
button.btn.primary:hover:not(:disabled){background:#ffd591}
button.btn.ghost{background:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
kbd{font:inherit;font-size:11px;opacity:.6;margin-left:4px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,12,30,.84);padding:18px;overflow:auto}
.sheet{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;margin:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.05;margin:0;color:var(--amber);text-wrap:balance}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--amber)}
.sheet p{margin:0;color:var(--ink)}
.sheet p.dim{color:var(--ink-dim);font-size:13.5px}
.sheet .col{display:grid;gap:8px}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgrid .btn{padding:12px 4px;font-variant-numeric:tabular-nums}
.pgrid .btn.solved{border-color:var(--ok);color:var(--ok)}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .top h1{font-size:24px}
  .top .sub{order:3;flex-basis:100%}
  .top h1{flex:1}
  .sheet h2{font-size:28px}
  .info{min-height:0}
}
</style>

<div class="app">
  <header class="top">
    <h1>Фонарщики</h1>
    <span class="sub">Тактика без оружия: заставь тьму бить по самой себе</span>
    <button class="btn ghost" id="btnMenu" type="button">Меню</button>
  </header>
  <main class="stage">
    <div class="boardwrap">
      <canvas id="cv" aria-label="Игровое поле"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <aside class="panel">
      <div class="status">
        <div><div class="where" id="stWhere">Ночь 1</div><div class="turn" id="stTurn">Ход 1 из 5</div></div>
        <div class="pips" id="stLight" title="Свет города"></div>
      </div>
      <div class="forecast" id="forecast"></div>
      <div class="heroes" id="heroes"></div>
      <div class="info" id="info"></div>
      <div class="actions">
        <button class="btn" id="btnUndo" type="button">Отменить<kbd>Z</kbd></button>
        <button class="btn" id="btnReset" type="button">Сбросить ход<kbd>R</kbd></button>
        <button class="btn primary" id="btnEnd" type="button">Закончить ход<kbd>Пробел</kbd></button>
      </div>
    </aside>
  </main>
</div>

<script>
//<ENGINE>
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const ETYPES={
  biter:{name:'Грыз',hp:2,move:3,dmg:1},
  spitter:{name:'Плевака',hp:1,move:2,dmg:1},
  charger:{name:'Бодач',hp:2,move:1,dmg:2},
  mortar:{name:'Метатель',hp:1,move:1,dmg:2},
};
const HTYPES={
  wind:{name:'Ветродуй',hp:3,move:4},
  hook:{name:'Крючник',hp:3,move:3},
  mirror:{name:'Зеркальщик',hp:3,move:3},
};
const NIGHTS=[
  {pool:['biter','spitter'],init:['biter','spitter'],sched:[1,1,1,1],lanterns:4},
  {pool:['biter','spitter','charger'],init:['biter','charger','spitter'],sched:[1,1,1,1],lanterns:4},
  {pool:['biter','spitter','charger','mortar'],init:['mortar','biter','charger'],sched:[1,1,2,1],lanterns:4},
  {pool:['biter','spitter','charger','mortar'],init:['mortar','charger','spitter'],sched:[1,2,1,2],lanterns:4},
  {pool:['biter','spitter','charger','mortar'],init:['mortar','charger','biter','spitter'],sched:[2,1,2,1],lanterns:5},
];
function rnd(s){s.seed=(s.seed+0x6D2B79F5)|0;let t=s.seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function clone(s){return {...s,ents:s.ents.map(e=>({...e})),spawns:s.spawns.map(p=>({...p}))};}
function inb(s,x,y){return x>=0&&y>=0&&x<s.w&&y<s.h;}
function tileAt(s,x,y){return s.tiles[y*s.w+x];}
function entAt(s,x,y){for(const e of s.ents)if(!e.dead&&e.x===x&&e.y===y)return e;return null;}
function getEnt(s,id){for(const e of s.ents)if(e.id===id)return e;return null;}
function free(s,x,y){return inb(s,x,y)&&tileAt(s,x,y)===0&&!entAt(s,x,y);}
function mkState(w,h,seed){return {w,h,tiles:new Array(w*h).fill(0),ents:[],spawns:[],seed:seed|0,nid:1,turn:1,maxTurns:5,light:0,doused:0,kills:0,night:0,over:null,puzzle:false,sched:[],pool:[]};}
function addEnt(s,t,x,y,dir){
  let e;
  if(t==='lantern')e={k:'lantern',t,x,y,hp:1,mhp:1,lit:true};
  else if(HTYPES[t])e={k:'hero',t,x,y,hp:HTYPES[t].hp,mhp:HTYPES[t].hp,lit:false};
  else e={k:'enemy',t,x,y,hp:ETYPES[t].hp,mhp:ETYPES[t].hp,lit:false};
  e.id=s.nid++;e.dir=dir==null?-1:dir;e.dead=false;e.moved=false;e.acted=false;
  s.ents.push(e);return e;
}
function damage(s,e,n,ev){
  if(e.dead)return;
  if(e.k==='lantern'){if(e.lit){e.lit=false;s.light--;s.doused++;ev.push({t:'douse',id:e.id});}return;}
  e.hp-=n;ev.push({t:'dmg',id:e.id,n,hp:Math.max(0,e.hp)});
  if(e.hp<=0){e.dead=true;if(e.k==='enemy')s.kills++;ev.push({t:'die',id:e.id});}
}
function drown(s,e,ev){e.dead=true;e.hp=0;if(e.k==='enemy')s.kills++;ev.push({t:'drown',id:e.id});}
function push(s,e,d,ev){
  const nx=e.x+DIRS[d][0],ny=e.y+DIRS[d][1];
  if(!inb(s,nx,ny)){ev.push({t:'bump',id:e.id,d,soft:true});return;}
  const o=entAt(s,nx,ny);
  if(tileAt(s,nx,ny)===1||o){ev.push({t:'bump',id:e.id,d});damage(s,e,1,ev);if(o&&o.k!=='lantern')damage(s,o,1,ev);return;}
  e.x=nx;e.y=ny;ev.push({t:'slide',id:e.id,x:nx,y:ny});
  if(tileAt(s,nx,ny)===2)drown(s,e,ev);
}
function scan(s,x,y,d){
  let n=0;
  for(;;){x+=DIRS[d][0];y+=DIRS[d][1];n++;if(!inb(s,x,y))return null;const o=entAt(s,x,y);if(o||tileAt(s,x,y)===1)return {x,y,ent:o,dist:n};}
}
function heroTargets(s,h){
  const out=[];if(h.acted||h.dead)return out;
  for(let d=0;d<4;d++){const o=inb(s,h.x+DIRS[d][0],h.y+DIRS[d][1])?entAt(s,h.x+DIRS[d][0],h.y+DIRS[d][1]):null;if(o&&o.k==='lantern'&&!o.lit)out.push({x:o.x,y:o.y,light:true});}
  if(h.t==='mirror'){
    for(const e of s.ents){if(e.dead||e===h||e.k==='lantern')continue;if(Math.abs(e.x-h.x)+Math.abs(e.y-h.y)<=3)out.push({x:e.x,y:e.y});}
    return out;
  }
  for(let d=0;d<4;d++){
    const r=scan(s,h.x,h.y,d);if(!r)continue;
    const unit=r.ent&&r.ent.k!=='lantern';
    if(h.t==='wind'){if(unit)out.push({x:r.x,y:r.y,d});}
    else{
      if(r.dist<2)continue;
      if(unit)out.push({x:r.x,y:r.y,d});
      else{let ok=true;for(let i=1;i<r.dist;i++)if(tileAt(s,h.x+DIRS[d][0]*i,h.y+DIRS[d][1]*i)===2)ok=false;if(ok)out.push({x:r.x,y:r.y,d,self:true});}
    }
  }
  return out;
}
function heroAct(s,h,tg,ev){
  h.acted=true;h.moved=true;
  if(tg.light){const o=entAt(s,tg.x,tg.y);o.lit=true;s.light++;s.doused--;ev.push({t:'relight',id:o.id});return;}
  if(h.t==='mirror'){const o=entAt(s,tg.x,tg.y);ev.push({t:'swap',a:h.id,b:o.id});const x=h.x,y=h.y;h.x=o.x;h.y=o.y;o.x=x;o.y=y;return;}
  const r=scan(s,h.x,h.y,tg.d);
  if(h.t==='wind'){ev.push({t:'gust',id:h.id,x:r.x,y:r.y,d:tg.d});push(s,r.ent,tg.d,ev);return;}
  ev.push({t:'hook',id:h.id,x:r.x,y:r.y});
  const bd=(tg.d+2)%4;
  if(tg.self){h.x=r.x+DIRS[bd][0];h.y=r.y+DIRS[bd][1];ev.push({t:'slide',id:h.id,x:h.x,y:h.y});}
  else{
    const e=r.ent;let x=e.x,y=e.y,dr=false;
    for(let i=1;i<r.dist;i++){x+=DIRS[bd][0];y+=DIRS[bd][1];if(tileAt(s,x,y)===2){dr=true;break;}}
    e.x=x;e.y=y;ev.push({t:'slide',id:e.id,x,y});if(dr)drown(s,e,ev);
  }
}
function reach(s,e,range){
  const res=new Map(),k0=e.y*s.w+e.x;res.set(k0,{x:e.x,y:e.y,p:-1,n:0});const q=[k0];
  for(let i=0;i<q.length;i++){
    const c=res.get(q[i]);if(c.n>=range)continue;
    for(const[dx,dy]of DIRS){const x=c.x+dx,y=c.y+dy,k=y*s.w+x;if(res.has(k)||!free(s,x,y))continue;res.set(k,{x,y,p:q[i],n:c.n+1});q.push(k);}
  }
  return res;
}
function pathTo(res,k){const p=[];while(k!==-1){const c=res.get(k);p.unshift([c.x,c.y]);k=c.p;}return p;}
function heroMove(s,h,x,y,ev){
  const r=reach(s,h,HTYPES[h.t].move);ev.push({t:'walk',id:h.id,path:pathTo(r,y*s.w+x)});h.x=x;h.y=y;h.moved=true;
}
function threat(s,e){
  const dx=DIRS[e.dir][0],dy=DIRS[e.dir][1],path=[];let x=e.x,y=e.y;
  if(e.t==='biter'){x+=dx;y+=dy;return {path,hit:inb(s,x,y)?[x,y]:null};}
  if(e.t==='mortar'){x+=dx*3;y+=dy*3;return {path,hit:inb(s,x,y)?[x,y]:null,arc:true};}
  for(;;){
    x+=dx;y+=dy;if(!inb(s,x,y))return {path,hit:null};
    if(entAt(s,x,y)||tileAt(s,x,y)===1)return {path,hit:[x,y]};
    path.push([x,y]);
    if(e.t==='charger'&&tileAt(s,x,y)===2)return {path,hit:null,drown:true};
  }
}
function enemyAttack(s,e,ev){
  const th=threat(s,e);ev.push({t:'atk',id:e.id,th,d:e.dir,et:e.t});
  if(e.t==='charger'&&th.path.length){
    const p=th.path[th.path.length-1];e.x=p[0];e.y=p[1];ev.push({t:'slide',id:e.id,x:e.x,y:e.y,fast:true});
    if(th.drown){drown(s,e,ev);return;}
  }
  if(th.hit){
    const o=entAt(s,th.hit[0],th.hit[1]);ev.push({t:'hit',x:th.hit[0],y:th.hit[1]});
    if(o)damage(s,o,ETYPES[e.t].dmg,ev);else if(e.t==='charger')damage(s,e,1,ev);
  }
  e.dir=-1;
}
function scoreIntent(s,e,taken){
  const th=threat(s,e),T=ETYPES[e.t];let sc=0,tid=0;
  if(th.drown)sc=-50;
  else if(th.hit){
    const o=entAt(s,th.hit[0],th.hit[1]);
    if(o){
      if(o.k==='lantern')sc=o.lit?7:0;else if(o.k==='hero')sc=6+(o.hp<=T.dmg?1:0);else sc=-6;
      if(sc>0){tid=o.id;if(taken.has(o.id)&&o.k==='hero')sc-=3;}
    }else if(e.t==='charger')sc=-4;
  }
  return {sc,tid};
}
function planEnemy(s,e,ev,taken,mv){
  const T=ETYPES[e.t],r=reach(s,e,mv==null?T.move:mv),ox=e.x,oy=e.y;
  let best=null,bs=-1e9;
  for(const[k,c]of r){
    e.x=c.x;e.y=c.y;
    for(let d=0;d<4;d++){
      e.dir=d;const q=scoreIntent(s,e,taken);const v=q.sc+rnd(s)*0.9-c.n*0.05;
      if(v>bs){bs=v;best={k,d,tid:q.tid,real:q.sc};}
    }
  }
  if(best.real<1){
    const tgs=s.ents.filter(o=>!o.dead&&((o.k==='lantern'&&o.lit)||o.k==='hero'));
    let bd=1e9,bk=null,bt=null;
    for(const[k,c]of r)for(const o of tgs){
      const dd=Math.abs(o.x-c.x)+Math.abs(o.y-c.y)+(o.k==='hero'?2:0)+c.n*0.01;
      if(dd<bd){bd=dd;bk=k;bt=o;}
    }
    if(bk!==null){
      const c=r.get(bk);e.x=c.x;e.y=c.y;
      const ax=bt.x-c.x,ay=bt.y-c.y;const toward=Math.abs(ax)>=Math.abs(ay)?(ax>0?1:3):(ay>0?2:0);
      let dd=toward,ds=-1e9;
      for(let d=0;d<4;d++){e.dir=d;const v=scoreIntent(s,e,taken).sc+(d===toward?0.5:0);if(v>ds){ds=v;dd=d;}}
      best={k:bk,d:dd,tid:0};
    }
  }
  e.x=ox;e.y=oy;
  const c=r.get(best.k);
  if(c.x!==ox||c.y!==oy){ev.push({t:'walk',id:e.id,path:pathTo(r,best.k)});e.x=c.x;e.y=c.y;}
  e.dir=best.d;if(best.tid)taken.add(best.tid);
}
function rollSpawns(s){
  s.spawns=[];if(s.turn>=s.maxTurns)return;
  let n=s.sched[s.turn-1]||0;
  const alive=s.ents.filter(e=>e.k==='enemy'&&!e.dead).length;n=Math.min(n,6-alive);
  const edges=[];
  for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++)if((x===0||y===0||x===s.w-1||y===s.h-1)&&free(s,x,y))edges.push([x,y]);
  for(let i=0;i<n&&edges.length;i++){
    const p=edges.splice(Math.floor(rnd(s)*edges.length),1)[0];
    s.spawns.push({x:p[0],y:p[1],t:s.pool[Math.floor(rnd(s)*s.pool.length)]});
  }
}
function doSpawns(s,ev){
  for(const p of s.spawns){
    const o=entAt(s,p.x,p.y);
    if(o){ev.push({t:'blocked',x:p.x,y:p.y});damage(s,o,1,ev);}
    else{const e=addEnt(s,p.t,p.x,p.y);ev.push({t:'spawn',id:e.id,x:p.x,y:p.y,et:p.t});}
  }
  s.spawns=[];
}
function attackPhase(s,ev){for(const e of s.ents.slice())if(e.k==='enemy'&&!e.dead&&e.dir>=0)enemyAttack(s,e,ev);}
function heroesAlive(s){return s.ents.some(e=>e.k==='hero'&&!e.dead);}
function puzzleSolved(s){return s.doused===0&&!s.ents.some(e=>(e.k==='enemy'&&!e.dead)||(e.k==='hero'&&e.dead));}
function endTurn(s,ev){
  ev.push({t:'phase',n:'atk'});
  attackPhase(s,ev);
  if(s.puzzle){s.over=puzzleSolved(s)?'win':'lose';return;}
  if(s.light<=0||!heroesAlive(s)){s.over='lose';return;}
  if(s.turn>=s.maxTurns){s.over='win';return;}
  s.turn++;
  doSpawns(s,ev);
  if(!heroesAlive(s)){s.over='lose';return;}
  const taken=new Set();
  for(const e of s.ents.slice())if(e.k==='enemy'&&!e.dead)planEnemy(s,e,ev,taken);
  rollSpawns(s);
  for(const h of s.ents)if(h.k==='hero'){h.moved=false;h.acted=false;}
}
function forecast(s){
  const c=clone(s),ev=[];attackPhase(c,ev);
  const f={dead:new Set(),doused:new Set(),dmg:new Map(),solved:false};
  for(const e of ev){
    if(e.t==='die'||e.t==='drown')f.dead.add(e.id);
    else if(e.t==='douse')f.doused.add(e.id);
    else if(e.t==='dmg')f.dmg.set(e.id,(f.dmg.get(e.id)||0)+e.n);
  }
  f.solved=puzzleSolved(c);
  return f;
}
function genNight(n,seed,light){
  const cfg=NIGHTS[n-1];
  for(let attempt=0;;attempt++){
    const s=mkState(7,7,seed+attempt*7919);
    s.light=light;s.night=n;s.sched=cfg.sched;s.pool=cfg.pool;
    const ri=k=>Math.floor(rnd(s)*k);
    for(let c=0,nc=1+ri(2);c<nc;c++){
      let x=ri(7),y=ri(7);const d=ri(4),len=2+ri(2);

    if(u>=1){tweens.splice(i,1);t.res();}
  }
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>=fx[i].dur)fx.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=1.8*dt/1000;p.life-=dt/520;if(p.life<=0)parts.splice(i,1);}

    if(dz)parts.push(`<b>${dz===1?'погаснет':'погаснут'} ${dz} ${plural(dz,'фонарь','фонаря','фонарей')}</b>`);
    if(hd)parts.push(`<b>${hd===1?'падёт':'падут'} ${hd} ${plural(hd,'фонарщик','фонарщика','фонарщиков')}</b>`);
    if(hh)parts.push(`${hh===1?'ранен':'ранены'} ${hh} ${plural(hh,'фонарщик','фонарщика','фонарщиков')}`);
    if(ek)parts.push(`${ek===1?'сгинет':'сгинут'} ${ek} ${plural(ek,'морок','морока','мороков')}`);
    const pre=preview?'После этого действия: ':'Если закончить ход сейчас: ';
    if(S.puzzle){
      el.className='forecast'+(f.solved?'':' bad');
      el.innerHTML=f.solved?(preview?'После этого действия этюд решён.':'<b>Решение найдено.</b> Заканчивай ход.'):pre+(parts.join(', ')||'ничего не случится')+'. Нужно: все фонари горят, все мороки сгинули, фонарщики живы.';
    }else{
      el.className='forecast'+(dz||hd?' bad':'');
      el.innerHTML=pre+(parts.join(', ')||'фонари в безопасности')+'.';
    }
  }
  let hh='';
  for(const e of S.ents)if(e.k==='hero'){
    let hp='';for(let i=0;i<e.mhp;i++)hp+=`<i class="${i<e.hp?'':'off'}"></i>`;
    const st=e.dead?'выбыл':e.acted?'действовал':e.moved?'перешёл, может действовать':'готов';
    hh+=`<button type="button" class="hero${sel===e.id?' sel':''}${e.dead||e.acted?' done':''}" data-id="${e.id}"><span class="dot" style="background:${HCOL[e.t]}"></span><span class="nm">${HTYPES[e.t].name}<span class="st">${st}</span></span><span class="hp">${hp}</span></button>`;
  }
  $('heroes').innerHTML=hh;
  $('btnUndo').disabled=busy||!undo.length||!!S.over;
  $('btnReset').disabled=busy||!undo.length||!!S.over;
  $('btnEnd').disabled=busy||!!S.over||!mode;
  renderInfo();
}
function renderInfo(){
  let key=null;
  const pos=hover||pinned;
  if(pos&&S&&inb(S,pos[0],pos[1])){
    const o=entAt(S,pos[0],pos[1]);
    if(o)key=o.t;else if(S.spawns.some(p=>p.x===pos[0]&&p.y===pos[1]))key='spawn';
    else if(tileAt(S,pos[0],pos[1])===1)key='house';else if(tileAt(S,pos[0],pos[1])===2)key='canal';
  }
  if(!key&&sel!=null){const h=getEnt(S,sel);if(h)key=h.t;}
  $('info').innerHTML=key?DESC[key]:'Выбери фонарщика. Голубые клетки — куда он может встать, цветные уголки — на кого подействует его приём. Наведи курсор, чтобы увидеть исход заранее.';
}
function refresh(){fc=S?forecast(S):null;calcPreview();renderPanel();}
function calcPreview(){
  preview=null;if(busy||!S||S.over||sel==null||!hover)return;
  const h=getEnt(S,sel);if(!h||h.dead)return;
  const[x,y]=hover,tg=heroTargets(S,h).find(t=>t.x===x&&t.y===y);
  let c=null;
  if(tg){c=clone(S);heroAct(c,getEnt(c,sel),tg,[]);}
  else if(!h.moved&&!(x===h.x&&y===h.y)&&reach(S,h,HTYPES[h.t].move).has(y*S.w+x)){c=clone(S);heroMove(c,getEnt(c,sel),x,y,[]);}
  if(c)preview={c,fc:forecast(c)};
}

// ---------- flow ----------
function overlay(html){const o=$('overlay');if(html==null){o.hidden=true;o.innerHTML='';}else{o.hidden=false;o.innerHTML=`<div class="sheet">${html}</div>`;const b=o.querySelector('button');if(b)b.focus({preventScroll:true});}}
function loaded(){undo=[];sel=null;hover=null;pinned=null;preview=null;busy=false;enemyPhase=false;tweens.length=0;fx.length=0;syncVis();refresh();}
function showMenu(){
  overlay(`<h2>Мороки идут гасить фонари</h2>
  <p>У фонарщиков нет оружия. Есть ветер, крюк и зеркало. Двигай мороков так, чтобы они били друг друга, тонули в каналах и промахивались мимо фонарей.</p>
  <div class="col">
    <button class="btn primary" data-a="camp" type="button">Ночной дозор: 5 ночей</button>
    <button class="btn" data-a="puzzles" type="button">Этюды: задачи в один ход (${[...solved].filter(i=>i<PUZZLES.length).length}/${PUZZLES.length})</button>
    <button class="btn" data-a="rules" type="button">Как играть</button>
    ${mode?'<button class="btn ghost" data-a="close" type="button">Вернуться к игре</button>':''}
  </div>`);
}
function showRules(){
  overlay(`<h3>Как играть</h3>
  <ul>
    <li>Каждый морок заранее показывает, куда ударит. Цифра на нём — очередь удара.</li>
    <li>За ход каждый фонарщик может перейти и один раз применить приём. После приёма он больше не ходит.</li>
    <li><b style="color:var(--wind)">Ветродуй</b> толкает первого в линии на клетку. Удар о преграду ранит.</li>
    <li><b style="color:var(--hook)">Крючник</b> притягивает первого в линии к себе или сам летит к дому.</li>
    <li><b style="color:var(--mirror)">Зеркальщик</b> меняется местами с существом в 3 клетках.</li>
    <li>Любой фонарщик может вместо приёма зажечь погасший фонарь на соседней клетке.</li>
    <li>Сдвинутый морок бьёт в прежнем направлении, но уже с нового места.</li>
    <li>Прогноз справа всегда показывает, чем кончится ход. Наведи курсор на клетку, чтобы проверить действие до того, как его сделать. Отмена не ограничена.</li>
    <li>В дозоре нужно пережить 5 ходов за ночь. Каждый погасший фонарь отнимает свет города. Если к рассвету горят все фонари, город получает 1 свет.</li>
    <li>Клавиши: 1–3 выбрать фонарщика, Z отмена, R сброс хода, Пробел закончить ход.</li>
  </ul>
  <button class="btn primary" data-a="menu" type="button">Понятно</button>`);
}
function showPuzzles(){
  let g='';PUZZLES.forEach((p,i)=>{g+=`<button class="btn${solved.has(i)?' solved':''}" data-p="${i}" type="button">${i+1}${solved.has(i)?' ✓':''}</button>`;});
  overlay(`<h3>Этюды</h3><p class="dim">Один ход. Все фонари должны гореть, все мороки сгинуть, все фонарщики выжить. Чем дальше, тем труднее.</p><div class="pgrid">${g}</div><button class="btn ghost" data-a="menu" type="button">Назад</button>`);
}
function startCampaign(){mode='camp';camp={night:1,light:5,seed:(Date.now()^(Math.random()*1e9))|0,kills:0,doused:0};startNight();}
function startNight(){S=genNight(camp.night,camp.seed+camp.night*104729,camp.light);loaded();overlay(null);banner={text:`Ночь ${camp.night}`,t:0};}
function startPuzzle(i){mode='puz';puzIdx=i;S=loadPuzzle(PUZZLES[i]);loaded();overlay(null);banner={text:`Этюд ${i+1}`,t:0};}
function showEnd(){
  if(mode==='puz'){
    if(S.over==='win'){
      solved.add(puzIdx);try{localStorage.setItem('lamp-solved',JSON.stringify([...solved]));}catch(e){}
      const next=puzIdx+1<PUZZLES.length;
      overlay(`<h3>Этюд решён</h3><p>Ни один фонарь не погас, тьма съела сама себя.</p><div class="col">${next?'<button class="btn primary" data-a="nextp" type="button">Следующий этюд</button>':''}<button class="btn" data-a="puzzles" type="button">К списку этюдов</button></div>`);
    }else overlay(`<h3>Не вышло</h3><p>${S.doused?'Фонарь погас.':S.ents.some(e=>e.k==='hero'&&e.dead)?'Фонарщик пал.':'Кто-то из мороков уцелел.'} Попробуй иначе: порядок действий важен.</p><div class="col"><button class="btn primary" data-a="retryp" type="button">Ещё раз</button><button class="btn" data-a="puzzles" type="button">К списку этюдов</button></div>`);
    return;
  }
  camp.kills+=S.kills;camp.doused+=S.doused;
  if(S.over==='lose'){
    overlay(`<h3>Город погрузился во тьму</h3><p>${S.light<=0?'Последний свет погас':'Все фонарщики пали'} на ${camp.night}-й ночи. Изгнано мороков: ${camp.kills}.</p><div class="col"><button class="btn primary" data-a="camp" type="button">Начать дозор заново</button><button class="btn" data-a="menu" type="button">В меню</button></div>`);
    mode=null;return;
  }
  const perfect=S.doused===0;camp.light=Math.min(MAXLIGHT,S.light+(perfect?1:0));
  if(camp.night>=5){
    overlay(`<h3>Рассвет над городом</h3><p>Пять ночей позади. Свет города: ${camp.light} из ${MAXLIGHT}. Потеряно фонарей: ${camp.doused}. Изгнано мороков: ${camp.kills}.</p><div class="col"><button class="btn primary" data-a="camp" type="button">Новый дозор</button><button class="btn" data-a="puzzles" type="button">Этюды</button></div>`);
    mode=null;return;
  }
  overlay(`<h3>Рассвет. Ночь ${camp.night} пережита</h3><p>Не горит фонарей: ${S.doused}. Изгнано мороков: ${S.kills}. ${perfect?'Все фонари горят: город зажигает ещё один огонь.':''}</p><p class="dim">Свет города: ${camp.light} из ${MAXLIGHT}. Фонарщики отдохнули и здоровы.</p><button class="btn primary" data-a="nextn" type="button">Следующая ночь</button>`);
}
async function doAction(fn){
  if(busy)return;undo.push(clone(S));const ev=[];fn(ev);preview=null;
  await play(ev);const h=sel!=null?getEnt(S,sel):null;if(h&&(h.dead||h.acted))sel=null;refresh();
}
async function endTurnUI(){
  if(busy||!S||S.over||!mode||!$('overlay').hidden)return;
  sel=null;undo=[];preview=null;const ev=[];endTurn(S,ev);await play(ev);refresh();
  if(S.over){await wait(350);showEnd();renderPanel();}
  else banner={text:S.turn===S.maxTurns?'Последний ход до рассвета':`Ход ${S.turn}`,t:0};
}
function undoOne(){if(busy||!undo.length||S.over)return;S=undo.pop();sel=null;syncVis();refresh();}
function resetTurn(){if(busy||!undo.length||S.over)return;S=undo[0];undo=[];sel=null;syncVis();refresh();}
function selectHero(id){if(busy||!S||S.over)return;const h=getEnt(S,id);if(!h||h.dead||h.acted)return;sel=sel===id?null:id;calcPreview();renderPanel();}
function clickTile(x,y){
  if(busy||!S||S.over||!mode||!inb(S,x,y))return;
  const h=sel!=null?getEnt(S,sel):null;
  if(h&&!h.dead){
    const tg=heroTargets(S,h).find(t=>t.x===x&&t.y===y);
    if(tg){doAction(ev=>heroAct(S,h,tg,ev));return;}
    if(!h.moved&&!(x===h.x&&y===h.y)&&reach(S,h,HTYPES[h.t].move).has(y*S.w+x)){doAction(ev=>heroMove(S,h,x,y,ev));return;}
  }
  const o=entAt(S,x,y);pinned=[x,y];
  if(o&&o.k==='hero'&&!o.acted)sel=sel===o.id?null:o.id;else sel=null;
  calcPreview();renderPanel();
}
function tileFromEvent(e){const r=cv.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*SIZE,py=(e.clientY-r.top)/r.height*SIZE;return [Math.floor((px-PAD)/T),Math.floor((py-PAD)/T)];}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const t=tileFromEvent(e);if(!hover||hover[0]!==t[0]||hover[1]!==t[1]){hover=S&&inb(S,t[0],t[1])?t:null;calcPreview();renderPanel();}});
cv.addEventListener('pointerleave',()=>{if(hover){hover=null;calcPreview();renderPanel();}});
cv.addEventListener('click',e=>{const t=tileFromEvent(e);clickTile(t[0],t[1]);});
$('heroes').addEventListener('click',e=>{const b=e.target.closest('.hero');if(b)selectHero(+b.dataset.id);});
$('btnUndo').addEventListener('click',undoOne);$('btnReset').addEventListener('click',resetTurn);$('btnEnd').addEventListener('click',endTurnUI);
$('btnMenu').addEventListener('click',showMenu);
$('overlay').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p!=null){startPuzzle(+b.dataset.p);return;}
  switch(b.dataset.a){
    case 'camp':startCampaign();break;case 'puzzles':showPuzzles();break;case 'rules':showRules();break;case 'menu':showMenu();break;
    case 'close':overlay(null);break;case 'nextn':camp.night++;startNight();break;
    case 'nextp':startPuzzle(puzIdx+1);break;case 'retryp':startPuzzle(puzIdx);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(!$('overlay').hidden||!mode)return;
  const k=e.key.toLowerCase();
  if(k==='z'||k==='я'){undoOne();}
  else if(k==='r'||k==='к'){resetTurn();}
  else if(k===' '||k==='enter'){e.preventDefault();endTurnUI();}
  else if(k==='escape'){sel=null;calcPreview();renderPanel();}
  else if(k>='1'&&k<='3'){const hs=S.ents.filter(h=>h.k==='hero');if(hs[+k-1])selectHero(hs[+k-1].id);}
});
window.addEventListener('resize',resize);
resize();
S=genNight(1,20241,5);loaded();showMenu();
requestAnimationFrame(frame);
window.__game={get S(){return S},clickTile,endTurnUI,startPuzzle,startCampaign,get busy(){return busy}};
</script>
